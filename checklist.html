<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV PRO | 飛航風險管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        /* 螢幕操作環境 */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent;
            /* 極大底部緩衝：確保最後一項能捲動到 HUD 上方 */
            padding-bottom: 800px; 
        }

        /* 螢幕版大型觸控按鈕 */
        .risk-option input[type="radio"] { display: none; }
        .risk-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid #cbd5e1;
            font-weight: 900;
            border-radius: 18px;
            height: 70px;
            background: #ffffff;
            color: #475569;
            font-size: 1.25rem;
        }

        .btn-high:checked + label { background-color: #ef4444; color: white; border-color: #991b1b; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .btn-mid:checked + label { background-color: #f59e0b; color: white; border-color: #92400e; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .btn-low:checked + label { background-color: #10b981; color: white; border-color: #065f46; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

        .section-header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .big-checkbox { width: 45px; height: 45px; cursor: pointer; }

        /* --- A4 專業單面報告樣式 (僅列印時觸發) --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 5mm; 
            }
            body {
                background: white !important;
                padding-bottom: 0 !important;
                margin: 0 !important;
                color: black !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print { display: none !important; }
            
            #print-report-container { display: block !important; }
            
            /* 隱藏所有操作用的卡片 */
            .section-card, #decision-hud, .spacer-div { display: none !important; }

            .report-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 5px;
            }
            .report-table th, .report-table td {
                border: 1px solid #000;
                padding: 5px 8px;
                text-align: left;
                font-size: 10.5pt;
                line-height: 1.2;
            }
            .report-table th { background-color: #f0f0f0 !important; font-weight: 900; text-align: center; }
            
            .report-title { 
                font-size: 18pt !important; 
                font-weight: 900; 
                text-align: center; 
                margin-bottom: 10px; 
                border-bottom: 2px solid #000; 
                padding-bottom: 3px; 
            }
            
            .meta-info { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                gap: 5px; 
                margin-bottom: 10px; 
                font-weight: bold; 
                font-size: 10pt;
                border: 1px solid #ddd;
                padding: 8px;
                background: #fafafa !important;
            }
            
            .risk-tag {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 4px;
                font-weight: 900;
                font-size: 9.5pt;
                border: 1px solid #000;
                text-align: center;
                min-width: 80px;
            }
            .tag-high { background-color: #fee2e2 !important; color: #b91c1c !important; }
            .tag-mid { background-color: #fef3c7 !important; color: #92400e !important; }
            .tag-low { background-color: #d1fae5 !important; color: #047857 !important; }

            .decision-final-box {
                margin-top: 10px;
                border: 2px solid #000;
                padding: 10px;
                background: white !important;
                break-inside: avoid;
            }
            .signature-area {
                margin-top: 15px;
                display: flex;
                justify-content: space-between;
                font-weight: bold;
                font-size: 10.5pt;
            }
        }

        #print-report-container { display: none; }
        .spacer-div { height: 400px; width: 100%; }
    </style>
</head>
<body class="p-2 sm:p-4 lg:p-6">

    <div class="max-w-6xl mx-auto">
        <!-- 螢幕標題欄 -->
        <header class="section-header rounded-[30px] p-8 text-white shadow-2xl mb-6 relative overflow-hidden no-print">
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-3xl md:text-4xl font-black tracking-tighter">無人機飛航風險管理系統</h1>
                    <p class="text-slate-400 text-sm mt-1 font-bold tracking-widest uppercase opacity-80">Professional Flight Safety Intelligence</p>
                </div>
                <button onclick="window.print()" class="bg-white/10 hover:bg-white/20 px-6 py-3 rounded-2xl text-base font-black transition backdrop-blur-md border border-white/20">
                    🖨️ 導出專業 A4 報告
                </button>
            </div>
        </header>

        <!-- 基本資訊 (操作介面) -->
        <section class="section-card bg-white rounded-[25px] p-8 shadow-sm border border-slate-200 mb-6 grid grid-cols-2 lg:grid-cols-5 gap-4 no-print">
            <div class="col-span-2 lg:col-span-1 space-y-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">任務日期</label>
                <input type="date" id="mission_date" class="w-full bg-slate-50 border-b-2 border-slate-200 py-1 text-lg font-black text-slate-800 outline-none">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">場景類別</label>
                <select id="mission_type" class="w-full bg-slate-50 border-b-2 border-slate-200 py-1 text-lg font-black text-slate-800 outline-none">
                    <option value="火場搶救">🔥 火場</option><option value="山域搜救">⛰️ 山域</option>
                    <option value="水域救援">💧 水域</option><option value="一般勤務">📦 一般</option>
                </select>
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">執行次數</label>
                <input type="number" id="mission_count" value="0" oninput="calculateRisk()" class="w-full bg-slate-50 border-b-2 border-slate-200 py-1 text-lg font-black text-blue-600 outline-none">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">操作手</label>
                <input type="text" id="op_name" class="w-full bg-slate-50 border-b-2 border-slate-200 py-1 text-lg font-black text-slate-800 outline-none" placeholder="姓名">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">機體型號</label>
                <input type="text" id="drone_model" class="w-full bg-slate-50 border-b-2 border-slate-200 py-1 text-lg font-black text-slate-800 outline-none" placeholder="型號">
            </div>
        </section>

        <!-- 評估項目 (操作介面) -->
        <div id="risk-sections-ui" class="space-y-6 no-print"></div>

        <!-- 後勤紀錄 (操作介面) -->
        <section class="section-card bg-slate-900 rounded-[25px] p-8 text-white shadow-xl mt-6 mb-12 border border-slate-800 relative z-10 no-print">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                <div class="flex-1 text-white">
                    <h3 class="text-2xl font-black">後勤紀錄與飛航日誌 (Log)</h3>
                    <p class="text-slate-400 text-sm mt-1 font-medium">請落實維護紀錄與雲端日誌同步。</p>
                </div>
                <div class="grid grid-cols-2 gap-4 w-full lg:w-auto">
                    <label class="flex items-center gap-4 bg-white/5 p-4 rounded-xl border border-white/10 cursor-pointer">
                        <input type="checkbox" id="log_update" checked onchange="calculateRisk()" class="big-checkbox accent-blue-500">
                        <span class="text-sm font-black whitespace-nowrap text-white">日誌已更新</span>
                    </label>
                    <label class="flex items-center gap-4 bg-white/5 p-4 rounded-xl border border-white/10 cursor-pointer">
                        <input type="checkbox" id="cloud_sync" checked onchange="calculateRisk()" class="big-checkbox accent-blue-500">
                        <span class="text-sm font-black whitespace-nowrap text-white">Log 已同步</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 螢幕版強制佔位符 -->
        <div class="spacer-div no-print"></div>

        <!-- --- A4 報告專用容器 (僅列印時顯示) --- -->
        <div id="print-report-container">
            <h1 class="report-title">無人機飛航風險評估報告書</h1>
            
            <div class="meta-info">
                <div>任務日期：<span id="p-date"></span></div>
                <div>執行次數：<span id="p-count"></span> 次</div>
                <div>案件類別：<span id="p-type"></span></div>
                <div>機體型號：<span id="p-drone"></span></div>
                <div>主要操作手：<span id="p-op"></span></div>
                <div>後勤狀態：<span id="p-log"></span></div>
            </div>

            <table class="report-table">
                <thead>
                    <tr>
                        <th style="width: 25%;">維度類別</th>
                        <th style="width: 50%;">評估項目 (已勾選狀態)</th>
                        <th style="width: 25%;">判定結果</th>
                    </tr>
                </thead>
                <tbody id="print-table-body">
                    <!-- 由 JS 動態生成，僅顯示勾選結果 -->
                </tbody>
            </table>

            <div class="decision-final-box">
                <div class="flex justify-between items-baseline">
                    <h3 class="font-black text-lg underline">總體判定結果：<span id="p-final-title"></span></h3>
                    <div class="font-bold text-sm">高風險: <span id="p-high-count"></span> | 中風險: <span id="p-mid-count"></span></div>
                </div>
                <p id="p-final-desc" class="mt-2 text-[10pt] italic font-medium text-gray-700"></p>
            </div>

            <div class="signature-area">
                <div style="width: 45%;">現場指揮官簽章：<br><br><div style="border-bottom: 1px solid #000; height: 30px;"></div></div>
                <div style="width: 45%;">操作手簽章：<br><br><div style="border-bottom: 1px solid #000; height: 30px;"></div></div>
            </div>
        </div>

        <!-- 螢幕操作專用 HUD -->
        <div class="fixed bottom-6 left-6 right-6 z-[100] no-print">
            <div id="decision-hud" class="max-w-6xl mx-auto bg-white/95 backdrop-blur-xl border-4 border-slate-200 rounded-[30px] p-6 shadow-2xl transition-all duration-500">
                <div class="flex flex-col md:flex-row items-center gap-8 text-slate-800">
                    <div class="flex gap-8 border-r-2 border-slate-100 pr-8 shrink-0 text-center">
                        <div><p class="text-[10px] font-black text-slate-400">HIGH</p><p id="h-count" class="text-4xl font-black text-slate-300">0</p></div>
                        <div><p class="text-[10px] font-black text-slate-400">MID</p><p id="m-count" class="text-4xl font-black text-slate-300">0</p></div>
                    </div>
                    <div class="flex-1 text-center md:text-left">
                        <h4 id="h-title" class="text-2xl font-black">準備就緒...</h4>
                        <p id="h-desc" class="text-base text-slate-500 mt-1 font-medium italic">請勾選上方維度項目進行判定</p>
                    </div>
                    <div id="h-badge" class="px-10 py-4 rounded-2xl bg-slate-100 text-slate-400 font-black text-xl shadow-md uppercase">PENDING</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const assessmentData = [
            {
                category: "一、環境與空域因素",
                items: [
                    { id: "e1", label: "空域合法性 (紅/黃/綠區)", info: "Drone Map 確認空域狀態與權限申請。", sop: "起飛前確認航管區域與高度限制。" },
                    { id: "e2", label: "磁干擾 - 硬鐵 (Hard Iron)", info: "環境中的磁鐵、帶磁機件。", sop: "起降點 3m 內嚴禁強磁源。" },
                    { id: "e3", label: "磁干擾 - 軟鐵 (Soft Iron)", info: "鋼筋混凝土、鐵軌等造成地磁扭曲。", sop: "避免在大型金屬結構旁起降。" },
                    { id: "e4", label: "動態電磁干擾 (EMI)", info: "變壓器、電塔產生之動態磁場。", sop: "衛星數穩定度監控，異常應降落。" }
                ]
            },
            {
                category: "二、安全操作維度",
                items: [
                    { id: "s1", label: "飛行前檢查 (360度)", info: "槳葉、電池、動力系統全方位核查。", sop: "落實實體 360 度飛行前檢查。" },
                    { id: "s2", label: "飛越人群或密集區域", info: "任務區域人車密度評估。", sop: "避開或擬定緊急備降決策方案。" },
                    { id: "s3", label: "氣象與能見度", info: "風速、降雨及視距環境。", sop: "確認環境光影不影響避障效能。" },
                    { id: "s4", label: "飛手身心狀態 (IMSAFE)", info: "壓力、疲勞或操作手熟練度自評。", sop: "若執行次數少風險將自動加權。" }
                ]
            }
        ];

        const renderUI = () => {
            const container = document.getElementById('risk-sections-ui');
            container.innerHTML = assessmentData.map(section => `
                <div class="bg-white rounded-[30px] shadow-lg border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-10 py-5 border-b-2 border-slate-200">
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight">${section.category}</h2>
                    </div>
                    <div class="divide-y-2 divide-slate-50">
                        ${section.items.map(item => `
                            <div class="p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center hover:bg-slate-50/50 transition">
                                <div class="lg:col-span-6 space-y-1">
                                    <h4 class="text-2xl font-black text-slate-900 leading-tight">${item.label}</h4>
                                    <p class="text-lg text-slate-500 font-medium">${item.info}</p>
                                    <div class="inline-block mt-1 px-3 py-0.5 bg-blue-50 text-xs font-black text-blue-600 rounded-lg uppercase">SOP: ${item.sop}</div>
                                </div>
                                <div class="lg:col-span-6 grid grid-cols-3 gap-6 risk-option">
                                    <div class="relative"><input type="radio" name="${item.id}" id="${item.id}-h" class="btn-high" data-label="高風險" onchange="calculateRisk()"><label for="${item.id}-h">高</label></div>
                                    <div class="relative"><input type="radio" name="${item.id}" id="${item.id}-m" class="btn-mid" data-label="中風險" onchange="calculateRisk()"><label for="${item.id}-m">中</label></div>
                                    <div class="relative"><input type="radio" name="${item.id}" id="${item.id}-l" class="btn-low" data-label="安全" checked onchange="calculateRisk()"><label for="${item.id}-l">安</label></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        };

        const calculateRisk = () => {
            let h = document.querySelectorAll('.btn-high:checked').length;
            let m = document.querySelectorAll('.btn-mid:checked').length;
            const countInput = document.getElementById('mission_count');
            const count = parseInt(countInput.value) || 0;

            if (count < 1) h += 1; else if (count < 5) m += 1;

            document.getElementById('h-count').innerText = h;
            document.getElementById('m-count').innerText = m;

            let res = { type: 'safe', title: '✅ 安全可飛行', desc: '目前飛航風險極低。請依照既定計畫執行任務，隨時監控環境。', badge: 'Safe', color: 'border-green-500' };

            if (h >= 2 || (h === 1 && m >= 3) || m >= 5) {
                res = { type: 'danger', title: '❌ 綜合風險過高，中止任務', desc: '警告：累積風險過大，超出安全預案能力。請優化起降環境或重新評估。', badge: 'Abort', color: 'border-red-500' };
            } else if (h === 1) {
                res = { type: 'attention', title: '⚠️ 特別警告：高警戒飛行', desc: '具備單一高風險點。須指派觀察員輔助環境監視，隨時備手動操作。', badge: 'Warning', color: 'border-orange-500' };
            } else if (m >= 3) {
                res = { type: 'caution', title: '⚠ 謹慎飛行，需備妥預案', desc: '中風險項目累積。請確認所有減災 SOP 已完全落實並設定好 RTH。', badge: 'Caution', color: 'border-amber-500' };
            }

            const hud = document.getElementById('decision-hud');
            hud.className = `max-w-6xl mx-auto bg-white/95 backdrop-blur-xl border-4 rounded-[30px] p-6 shadow-2xl transition-all duration-500 ${res.color}`;
            document.getElementById('h-title').innerText = res.title;
            document.getElementById('h-desc').innerText = res.desc;
            const badge = document.getElementById('h-badge');
            badge.innerText = res.badge;
            badge.className = `px-10 py-4 rounded-2xl font-black text-xl text-white shadow-lg ${res.type === 'danger' ? 'bg-red-600' : res.type === 'attention' ? 'bg-orange-600' : res.type === 'caution' ? 'bg-amber-600' : 'bg-green-600'}`;

            updatePrintReport(h, m, res);
        };

        const updatePrintReport = (h, m, res) => {
            document.getElementById('p-date').innerText = document.getElementById('mission_date').value;
            document.getElementById('p-count').innerText = document.getElementById('mission_count').value;
            document.getElementById('p-type').innerText = document.getElementById('mission_type').value;
            document.getElementById('p-op').innerText = document.getElementById('op_name').value || "未填寫";
            document.getElementById('p-drone').innerText = document.getElementById('drone_model').value || "未填寫";
            
            const logS = document.getElementById('log_update').checked ? "日誌已更" : "未更新";
            const cloudS = document.getElementById('cloud_sync').checked ? "雲端同步" : "未同步";
            document.getElementById('p-log').innerText = `${logS} / ${cloudS}`;

            document.getElementById('p-high-count').innerText = h;
            document.getElementById('p-mid-count').innerText = m;
            document.getElementById('p-final-title').innerText = res.title;
            document.getElementById('p-final-desc').innerText = res.desc;

            const printBody = document.getElementById('print-table-body');
            let tableHTML = "";
            
            assessmentData.forEach(section => {
                let sectionAdded = false;
                section.items.forEach((item) => {
                    const selectedInput = document.querySelector(`input[name="${item.id}"]:checked`);
                    const riskLabel = selectedInput ? selectedInput.getAttribute('data-label') : "安全";
                    const riskClass = riskLabel === "高風險" ? "tag-high" : riskLabel === "中風險" ? "tag-mid" : "tag-low";

                    tableHTML += `
                        <tr>
                            ${!sectionAdded ? `<td rowspan="${section.items.length}" style="font-weight:bold; vertical-align:middle; text-align:center;">${section.category}</td>` : ''}
                            <td>
                                <div style="font-weight:bold;">${item.label}</div>
                                <div style="font-size:8pt; color:#444;">SOP: ${item.sop}</div>
                            </td>
                            <td style="text-align:center; vertical-align:middle;">
                                <span class="risk-tag ${riskClass}">${riskLabel}</span>
                            </td>
                        </tr>
                    `;
                    sectionAdded = true;
                });
            });
            printBody.innerHTML = tableHTML;
        };

        window.onload = () => {
            document.getElementById('mission_date').value = new Date().toISOString().split('T')[0];
            renderUI();
            calculateRisk();
        };
    </script>
</body>
</html>
