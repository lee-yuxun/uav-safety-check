<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無人機飛手風險評估自檢表 - 自動計算版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent;
        }

        /* 自定義大尺寸單選按鈕樣式 */
        .risk-option input[type="radio"] {
            display: none;
        }

        .risk-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            font-weight: 500;
        }

        /* 高風險 - 紅色 */
        .btn-high:checked + label {
            background-color: #ef4444;
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            transform: scale(1.05);
        }
        
        /* 中風險 - 黃色 */
        .btn-mid:checked + label {
            background-color: #f59e0b;
            color: white;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            transform: scale(1.05);
        }

        /* 低風險 - 綠色 */
        .btn-low:checked + label {
            background-color: #10b981;
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            transform: scale(1.05);
        }

        @media print {
            .no-print { display: none; }
            body { background: white; }
            .card { border: 1px solid #ddd; box-shadow: none; }
        }
    </style>
</head>
<body class="p-2 sm:p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- 頂部標題卡片 -->
        <div class="bg-slate-900 rounded-t-2xl p-6 text-white shadow-lg border-b border-slate-700">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">無人機飛手風險評估自檢表</h1>
                    <p class="text-slate-400 text-xs sm:text-sm mt-1 uppercase tracking-wider">UAV Risk Assessment - Auto Calc V3</p>
                </div>
                <div class="no-print flex gap-2">
                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                        導出 PDF / 列印
                    </button>
                </div>
            </div>
        </div>

        <!-- 基本資訊網格 -->
        <div class="bg-white p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 border-x border-slate-200">
            <div class="space-y-1">
                <label class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">任務日期</label>
                <input type="date" class="w-full bg-slate-50 border border-slate-200 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">機型</label>
                <input type="text" placeholder="例: DJI Mavic 3" class="w-full bg-slate-50 border border-slate-200 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">地點</label>
                <input type="text" placeholder="任務空域座標/名稱" class="w-full bg-slate-50 border border-slate-200 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">案件類別</label>
                <select class="w-full bg-slate-50 border border-slate-200 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none appearance-none">
                    <option>🔥 火場搶救</option>
                    <option>⛰️ 山域搜救</option>
                    <option>💧 水域救援</option>
                    <option>📦 其他勤務</option>
                </select>
            </div>
        </div>

        <!-- 評估內容區 -->
        <div class="bg-white border-x border-slate-200">
            
            <!-- 桌面端表頭 -->
            <div class="hidden md:grid grid-cols-12 bg-slate-100 py-3 px-6 text-xs font-bold text-slate-600 uppercase tracking-widest border-y border-slate-200">
                <div class="col-span-2">評估類別</div>
                <div class="col-span-4">評估項目</div>
                <div class="col-span-4 text-center">風險等級 (觸控選擇)</div>
                <div class="col-span-2 text-right">減災行動</div>
            </div>

            <!-- 評估項目列表 -->
            <div id="risk-items-container" class="divide-y divide-slate-100">
                <!-- 由 JavaScript 動態生成或維持靜態，此處為求結構清晰直接列出 -->
            </div>
        </div>

        <!-- 底部自動決策區 -->
        <div class="bg-slate-50 p-6 rounded-b-2xl border border-slate-200 border-t-0 shadow-inner">
            <div class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-8">
                
                <div class="w-full lg:max-w-2xl space-y-4">
                    <div class="flex justify-between items-end">
                        <h3 class="text-sm font-bold text-slate-700 uppercase tracking-widest">總體決策結果 (自動計算)</h3>
                        <div class="text-xs font-bold text-slate-500 bg-white px-3 py-1 rounded-full border border-slate-200">
                            計數：高風險 <span id="high-count" class="text-red-500">0</span> | 
                            中風險 <span id="mid-count" class="text-amber-500">0</span>
                        </div>
                    </div>
                    
                    <!-- 自動結果顯示區域 -->
                    <div id="decision-box" class="p-5 rounded-2xl border-2 transition-all duration-300 flex items-center gap-4 bg-white border-slate-200">
                        <div id="decision-icon" class="text-3xl">💡</div>
                        <div>
                            <div id="decision-title" class="font-bold text-lg text-slate-800">請開始評估項目</div>
                            <div id="decision-desc" class="text-sm text-slate-500">勾選上方風險等級，系統將自動判定飛行建議。</div>
                        </div>
                    </div>
                </div>

                <div class="w-full lg:w-auto flex flex-col items-end justify-center">
                    <div class="w-full sm:w-64">
                        <label class="block text-[10px] text-slate-500 font-bold uppercase mb-1">飛手/負責人電子簽署</label>
                        <div class="h-16 w-full border-b-2 border-slate-900 bg-transparent flex items-end pb-2">
                            <span class="text-slate-300 italic text-sm">請在此處點擊簽署...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-200 flex flex-col sm:flex-row justify-between gap-4 text-[10px] text-slate-400 font-bold tracking-widest uppercase">
                <div>Drone Ops Response Team 表格作者 陳錦樺</div>
                <div>安全第一 · 預案先行，網頁作者 李宇軒</div>
            </div>
        </div>
    </div>

    <script>
        const riskData = [
            { cat: "環境因素", item: "天氣狀況 (風、雨、霧)", action: "查閱氣象 App", name: "r1" },
            { cat: "環境因素", item: "空域合法性 (紅/黃/綠區)", action: "Drone Map 確認", name: "r2" },
            { cat: "環境因素", item: "地形複雜 (崖、谷、建物)", action: "實地勘景", name: "r3" },
            { cat: "干擾源", item: "GPS 訊號與衛星數", action: "確認衛星數 > 12", name: "r4" },
            { cat: "干擾源", item: "電磁/無線電干擾 (電塔)", action: "避開干擾區", name: "r5" },
            { cat: "操作因素", item: "飛手身心狀態 (IMSAFE)", action: "嚴禁疲勞飛行", name: "r6" },
            { cat: "操作因素", item: "軟體/機型熟悉度", action: "事先模擬測試", name: "r7" },
            { cat: "操作因素", item: "飛行前檢查 (360度)", action: "落實檢查表", name: "r8" },
            { cat: "法規安全", item: "飛越人群或密集區域", action: "避開或備降方案", name: "r9" }
        ];

        const container = document.getElementById('risk-items-container');
        
        // 生成列表
        container.innerHTML = riskData.map((row) => `
            <div class="grid grid-cols-1 md:grid-cols-12 p-4 md:px-6 md:py-4 items-center gap-4 hover:bg-slate-50 transition">
                <div class="md:col-span-2">
                    <span class="md:hidden text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded uppercase tracking-tighter">${row.cat}</span>
                    <span class="hidden md:block font-bold text-slate-700">${row.cat}</span>
                </div>
                <div class="md:col-span-4">
                    <p class="text-sm sm:text-base font-medium text-slate-900">${row.item}</p>
                    <p class="md:hidden text-xs text-slate-400 mt-1 italic">提示：${row.action}</p>
                </div>
                <div class="md:col-span-4 flex justify-between gap-2 sm:gap-4 risk-option">
                    <div class="flex-1">
                        <input type="radio" name="${row.name}" id="${row.name}-h" class="btn-high" onchange="calculateRisk()">
                        <label for="${row.name}-h" class="w-full py-3 rounded-xl bg-slate-100 text-slate-400 text-xs sm:text-sm">高</label>
                    </div>
                    <div class="flex-1">
                        <input type="radio" name="${row.name}" id="${row.name}-m" class="btn-mid" onchange="calculateRisk()">
                        <label for="${row.name}-m" class="w-full py-3 rounded-xl bg-slate-100 text-slate-400 text-xs sm:text-sm">中</label>
                    </div>
                    <div class="flex-1">
                        <input type="radio" name="${row.name}" id="${row.name}-l" class="btn-low" checked onchange="calculateRisk()">
                        <label for="${row.name}-l" class="w-full py-3 rounded-xl bg-slate-100 text-slate-400 text-xs sm:text-sm">低</label>
                    </div>
                </div>
                <div class="hidden md:block md:col-span-2 text-right">
                    <span class="text-xs text-slate-400 italic">${row.action}</span>
                </div>
            </div>
        `).join('');

        function calculateRisk() {
            const highCount = document.querySelectorAll('.btn-high:checked').length;
            const midCount = document.querySelectorAll('.btn-mid:checked').length;

            document.getElementById('high-count').innerText = highCount;
            document.getElementById('mid-count').innerText = midCount;

            const box = document.getElementById('decision-box');
            const icon = document.getElementById('decision-icon');
            const title = document.getElementById('decision-title');
            const desc = document.getElementById('decision-desc');

            // 判斷邏輯
            if (highCount >= 2) {
                updateUI("bg-red-50 border-red-500", "❌ 一律不建議起飛", "高風險項目過多，飛行安全威脅極大，請立即中止任務。", "🚫");
            } 
            else if (highCount === 1) {
                if (midCount >= 3) {
                    updateUI("bg-red-50 border-red-500", "❌ 綜合風險過高，建議不飛行", "雖然只有一個高風險，但中風險累積過多，整體不穩定度高。", "🚫");
                } else {
                    updateUI("bg-orange-50 border-orange-500", "⚠️ 可飛但需特別注意", "存在單一高風險因子，必須指派觀察員並隨時準備手動接管。", "⚠️");
                }
            } 
            else { // highCount === 0
                if (midCount >= 5) {
                    updateUI("bg-red-50 border-red-500", "❌ 建議不飛，累積風險過高", "中風險項目累積達 5 項以上，隨時可能轉化為重大事故。", "🚫");
                } else if (midCount >= 3) {
                    updateUI("bg-amber-50 border-amber-500", "⚠ 謹慎飛行，需有應對預案", "中風險項目適中，請務必確認所有減災行動已落實。", "🧐");
                } else {
                    updateUI("bg-green-50 border-green-500", "✅ 安全可飛行，風險可控", "目前環境與操作狀態良好，請維持安全操作標準。", "✅");
                }
            }

            function updateUI(boxClass, titleText, descText, iconEmoji) {
                box.className = `p-5 rounded-2xl border-2 transition-all duration-300 flex items-center gap-4 ${boxClass}`;
                title.innerText = titleText;
                desc.innerText = descText;
                icon.innerText = iconEmoji;
                
                // 動態調整文字顏色
                if(boxClass.includes('red')) title.className = "font-bold text-lg text-red-700";
                else if(boxClass.includes('orange')) title.className = "font-bold text-lg text-orange-700";
                else if(boxClass.includes('amber')) title.className = "font-bold text-lg text-amber-700";
                else title.className = "font-bold text-lg text-green-700";
            }
        }

        // 初始化計算
        window.onload = calculateRisk;
    </script>
</body>
</html>
